name: Publish PR artefacts

on:
  workflow_run:
    workflows:
      - Build PR artefacts
    types:
      - completed

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve PR and available artefacts
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # for listing the artefacts of the build run
      pull-requests: read # for resolving the PR via the API
      statuses: read # for checking the REPL artefacts authorization of fork PRs
    outputs:
      pr-found: ${{ steps.resolve.outputs.pr-found }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      repl-authorized: ${{ steps.resolve.outputs.repl-authorized }}
      has-repl-artefacts: ${{ steps.artefacts.outputs.has-repl-artefacts }}
      has-performance-report: ${{ steps.artefacts.outputs.has-performance-report }}
    steps:
      - name: Resolve and validate PR
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -o pipefail
          # Live API data is authoritative: the PR may have been closed or its
          # head may have moved on since the build started. Repository, branch
          # and SHA together can still match multiple PRs when one branch
          # targets several bases; publishing is skipped rather than done for
          # a guessed PR.
          PR_NUMBERS=$(gh api --paginate --slurp "/repos/$REPOSITORY/pulls?state=open&per_page=100" \
            | jq -c --arg sha "$HEAD_SHA" --arg repo "$HEAD_REPO" --arg branch "$HEAD_BRANCH" \
              '[.[][] | select(.head.sha == $sha and .head.repo.full_name == $repo and .head.ref == $branch) | .number]')

          MATCHING_PRS=$(jq length <<<"$PR_NUMBERS")
          if [[ "$MATCHING_PRS" != 1 ]]; then
            if [[ "$MATCHING_PRS" -gt 1 ]]; then
              echo "::warning::The build head matches $MATCHING_PRS open PRs, skipping to avoid publishing for the wrong one"
            fi
            {
              echo "pr-found=false"
              echo "repl-authorized=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "pr-found=true"
            echo "pr-number=$(jq -r '.[0]' <<<"$PR_NUMBERS")"
          } >> "$GITHUB_OUTPUT"

          # Same-repo PRs are trusted; fork PRs need the authorization that the
          # "Authorize REPL artefacts" workflow recorded for this exact head.
          # Only grants from the Actions bot count, and the newest one wins.
          if [[ "$HEAD_REPO" == "$REPOSITORY" ]]; then
            echo "repl-authorized=true" >> "$GITHUB_OUTPUT"
          else
            AUTHORIZED=$(gh api "/repos/$REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" \
              --jq '[.[] | select(.context == "repl-artefacts-authorization" and .creator.login == "github-actions[bot]")] | first | .state == "success"')
            echo "repl-authorized=$AUTHORIZED" >> "$GITHUB_OUTPUT"
          fi
      - name: Check which artefacts were produced
        id: artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_FOUND: ${{ steps.resolve.outputs.pr-found }}
          REPL_AUTHORIZED: ${{ steps.resolve.outputs.repl-authorized }}
        run: |
          # Soft-failing or skipped jobs do not produce artefacts even though
          # the workflow still completes with 'success'.
          ARTEFACT_NAMES=$(gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name')
          HAS_REPL_ARTEFACTS=false
          if grep -qx 'repl-artefacts' <<< "$ARTEFACT_NAMES"; then
            HAS_REPL_ARTEFACTS=true
          fi
          echo "has-repl-artefacts=$HAS_REPL_ARTEFACTS" >> "$GITHUB_OUTPUT"
          if grep -qx 'performance-report' <<< "$ARTEFACT_NAMES"; then
            echo "has-performance-report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-performance-report=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$HAS_REPL_ARTEFACTS" == "true" && "$PR_FOUND" == "true" && "$REPL_AUTHORIZED" == "false" ]]; then
            echo "::notice::REPL artefacts were built but this PR head is not authorized to publish them"
          fi

  upload-repl-artefacts:
    name: Upload REPL artefacts and add comment
    needs: prepare
    if: ${{ needs.prepare.outputs.has-repl-artefacts == 'true' && needs.prepare.outputs.repl-authorized == 'true' }}
    permissions:
      pull-requests: write # for peter-evans/find-comment and peter-evans/create-or-update-comment
      actions: read # for downloading workflow run artifacts
      deployments: read # for resolving the Vercel preview deployment
      id-token: write # for AWS OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: repl-artefacts
          path: repl-artefacts
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload "rollup.browser.js" to bucket
        uses: zdurham/s3-upload-github-action@161dfa6991b9d88a97f02f4aeb5dcd26ea7e03cd # master
        with:
          args: --cache-control max-age=300,public
        env:
          FILE: repl-artefacts/rollup.browser.js
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          S3_KEY: ${{ needs.prepare.outputs.pr-number }}/rollup.browser.js
      - name: Upload "rollup.browser.js.map" to bucket
        uses: zdurham/s3-upload-github-action@161dfa6991b9d88a97f02f4aeb5dcd26ea7e03cd # master
        with:
          args: --cache-control max-age=300,public
        env:
          FILE: repl-artefacts/rollup.browser.js.map
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          S3_KEY: ${{ needs.prepare.outputs.pr-number }}/rollup.browser.js.map
      - name: Upload "bindings_wasm_bg.wasm" to bucket
        uses: zdurham/s3-upload-github-action@161dfa6991b9d88a97f02f4aeb5dcd26ea7e03cd # master
        with:
          args: --cache-control max-age=300,public
        env:
          FILE: repl-artefacts/bindings_wasm_bg.wasm
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          S3_KEY: ${{ needs.prepare.outputs.pr-number }}/bindings_wasm_bg.wasm
      - name: Find comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: findComment
        with:
          issue-number: ${{ needs.prepare.outputs.pr-number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Thank you for your contribution!'
      - name: Resolve REPL URL
        id: repl-url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
        run: |
          # Prefer the Vercel preview deployment for this SHA over the main
          # site; a failed lookup only falls back to the main site.
          PREVIEW_URL=""
          DEPLOYMENT_ID=$(gh api "/repos/$REPOSITORY/deployments?sha=$HEAD_SHA&environment=Preview" \
            --jq '.[0].id // empty' || true)
          if [[ -n "$DEPLOYMENT_ID" ]]; then
            PREVIEW_URL=$(gh api "/repos/$REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
              --jq '[.[] | select(.state == "success") | .environment_url] | first // empty' || true)
          fi
          echo "repl-url=${PREVIEW_URL:-https://rollupjs.org}/repl/?pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.findComment.outputs.comment-id }}
          issue-number: ${{ needs.prepare.outputs.pr-number }}
          edit-mode: replace
          body: |
            ### Thank you for your contribution! ❤️

            You can try out this pull request locally by installing Rollup via

            ```bash
            npm install ${{ github.event.workflow_run.head_repository.full_name }}#${{ github.event.workflow_run.head_branch }}
            ```

            Notice: Ensure you have installed the latest nightly Rust toolchain. If you haven't installed it yet, please see https://www.rust-lang.org/tools/install to learn how to download Rustup and install Rust.

            or load it into the REPL: ${{ steps.repl-url.outputs.repl-url }}

  report-performance:
    name: Report performance
    needs: prepare
    if: ${{ needs.prepare.outputs.pr-found == 'true' && needs.prepare.outputs.has-performance-report == 'true' }}
    permissions:
      pull-requests: write # for peter-evans/find-comment and peter-evans/create-or-update-comment
      actions: read # for downloading workflow run artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download performance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: performance-report
          path: performance-report
      - name: Find performance report comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: findPerformanceReport
        with:
          issue-number: ${{ needs.prepare.outputs.pr-number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Performance report'
      - name: Create or update performance report comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.findPerformanceReport.outputs.comment-id }}
          issue-number: ${{ needs.prepare.outputs.pr-number }}
          edit-mode: replace
          body-path: performance-report/result.md
